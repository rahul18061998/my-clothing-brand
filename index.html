<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIFUN 3 - Wear Your Joy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
        }

        /* Hero Section Animation */
        .hero {
            text-align: center;
            padding: 80px 20px;
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            font-size: 3.5rem;
            letter-spacing: 4px;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #ff7b00, #ff0055);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: slideDown 1s ease-out;
        }

        p {
            font-size: 1.2rem;
            color: #aaaaaa;
            margin-bottom: 30px;
            animation: fadeIn 2s ease-in-out;
        }

        .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: bounce 2s infinite;
        }

        /* Content Section for future updates */
        .content-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            margin-bottom: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .content-box h2 {
            margin-bottom: 15px;
            color: #ff7b00;
        }

        footer {
            padding: 20px;
            color: #666;
            font-size: 0.9rem;
        }

        /* Keyframes for Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideDown {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>HIFUN 3</h1>
        <p>Wear Your Joy — Something Amazing is Coming Soon!</p>
        <div class="badge">Launching Soon</div>
    </div>

    <!-- Yahan aap aur cheezein (products/images) baad mein jod sakte hain -->
    <div class="content-box">
        <h2>Stay Tuned</h2>
        <p>We are crafting the best collection for you. Check back later for our new drop!</p>
    </div>

    <footer>
        &copy; 2026 HIFUN 3. All Rights Reserved.
    </footer>

</body>
</html>
