<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Clothing Brand - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 2.5rem;
            color: #111;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        p {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .badge {
            display: inline-block;
            background-color: #000;
            color: #fff;
            padding: 8px 16px;
            font-size: 0.9rem;
            border-radius: 20px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .social-links {
            margin-top: 25px;
        }

        .social-links a {
            display: inline-block;
            margin: 0 10px;
            color: #333;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .social-links a:hover {
            color: #000;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="badge">Coming Soon</div>
        <h1>Something Exciting is Brewing</h1>
        <p>Hum bahut jald apna naya clothing brand launch kar rahe hain. Trendy aur stylish kapde aapke liye tayar kiye
            ja rahe hain. Stay tuned!</p>

        <div class="social-links">
            <a href="#" target="_blank">Instagram</a>
            <a href="#" target="_blank">Facebook</a>
            <a href="mailto:contact@yourdomain.com">Contact Us</a>
        </div>
    </div>

</body>

</html>
